[project]
name = "google-discover-api-mcp"
version = "1.0.1"
description = "Self-hosted Google Discover feed API and MCP server: the Discover feed of your country as JSON. Noncommercial use (PolyForm Noncommercial 1.0.0)."
readme = "README.md"
license = "PolyForm-Noncommercial-1.0.0"
license-files = ["LICENSE"]
classifiers = ["Programming Language :: Python :: 3", "Topic :: Internet :: WWW/HTTP"]
requires-python = ">=3.11"
authors = [{ name = "Cotlet", email = "contact@cotlet.dev" }]
keywords = ["google discover", "google discover api", "discover feed", "google discover mcp", "mcp server", "seo", "claude", "cursor"]
dependencies = [
    "curl_cffi>=0.13,<0.17",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "mcp>=1.12,<2",
    "jsonschema>=4.20",
]

[project.urls]
Homepage = "https://cotlet.dev/integrations/google-discover-api-mcp-server"
Source = "https://github.com/cotletdev/google-discover-api-mcp-server"

[project.scripts]
google-discover-mcp = "google_discover_api_mcp.cli:main"
google-discover-api-mcp = "google_discover_api_mcp.cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["google_discover_api_mcp"]

[tool.ruff]
line-length = 120
target-version = "py311"
